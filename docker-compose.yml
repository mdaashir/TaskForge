services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:latest
    user: root
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: taskforge-attachments
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/bitnami/minio/data

volumes:
  mongo-data:
  minio-data:
